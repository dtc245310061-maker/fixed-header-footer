<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Dropdown Ngang</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        #menu {
            height: 40px;
            background-color: black;
            border: 1px solid black;
        }

        #menu ul {
            list-style: none;
        }

        #menu li {
            position: relative;
            float: left;
        }

        #menu a {
            display: block;
            width: 120px;
            height: 40px;
            line-height: 40px;
            text-decoration: none;
            color: white;
            text-align: center;
        }

        #menu a:hover {
            background-color: red;
        }

        #menu ul ul {
            position: absolute;
            top: 40px;
            left: 0;
            visibility: hidden;
        }

        #menu ul li:hover > ul {
            visibility: visible;
        }
    </style>
</head>

<body>

    <div id="menu">
        <ul>
            <li><a href="#">Trang chủ</a></li>

            <li>
                <a href="#">Sản phẩm</a>
                <ul>
                    <li><a href="#">Điện thoại</a></li>
                    <li><a href="#">Máy tính</a></li>
                    <li><a href="#">Phụ kiện</a></li>
                </ul>
            </li>

            <li>
                <a href="#">Dịch vụ</a>
                <ul>
                    <li><a href="#">Tư vấn</a></li>
                    <li><a href="#">Bảo hành</a></li>
                </ul>
            </li>

            <li><a href="#">Liên hệ</a></li>
        </ul>
    </div>

</body>
</html>
